name: ShiftLog CI

on:
  push:
    branches: [main]
    paths:
      - "shiftlog-app/**"
      - ".github/workflows/shiftlog-ci.yml"
  pull_request:
    paths:
      - "shiftlog-app/**"
      - ".github/workflows/shiftlog-ci.yml"

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: shiftlog-app

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: shiftlog-app/package.json

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Run tests
        run: npm test -- --runInBand

      - name: Build
        run: npm run build

      - name: Upload production build
        uses: actions/upload-artifact@v4
        with:
          name: shiftlog-dist
          path: shiftlog-app/dist
